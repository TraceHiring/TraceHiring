# - happy-dom 20.14.6 (two highs fixed only in the 21.x major): GHSA-834v-8h66-3h79 (host code execution through a
#   crafted ESM import alias; needs `enableJavaScriptEvaluation: true` and attacker-supplied module source) and
#   GHSA-c8p4-j97h-3vg8 (published 2026-10-28; server-side requests when parsing untrusted HTML that holds `<iframe>`
#   or `<link rel="stylesheet">`). happy-dom is only the vitest DOM environment for apps/candidate and apps/recruiter
#   unit tests, which mount this repository's own components with JavaScript evaluation off (no
#   `enableJavaScriptEvaluation` anywhere) and never load or parse external HTML (the tests that mention `<link>` match
#   it as text with a regex). The fix is the major 21.0.4 (2026-10-20, past the two-week rule on 2026-11-03): move the
#   catalog to it by the expiry and delete both entries. 20.14.6 already fixes GHSA-5fpq-26gf-qwcr.
[[IgnoredVulns]]
