# Shared CI setup (spec specs/m0-foundations.md §7.1): pnpm, Node, gitleaks, then a frozen install.
# Every job runs this after its own checkout. No secret is passed in or read here: a composite
# action sees a repository secret only if a caller passes it as an input, and no caller does.
name: Trace setup
description: pnpm from packageManager, Node from .node-version with the pnpm cache, checksum-verified gitleaks, frozen install.

runs:
  using: composite
  steps:
    # Reads "packageManager": "pnpm@12.11.2" from the root package.json (no `version` input).
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - name: Set up Node from .node-version
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    # gitleaks is not on npm. The SHA-256 is the linux_x64 line of gitleaks_8.30.1_checksums.txt
    # from the v8.30.1 GitHub release; the archive is checked before it is unpacked.
    - name: Install gitleaks 8.30.1 (checksum-verified)
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        set -euo pipefail
        dir="$RUNNER_TEMP/gitleaks"
        archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        mkdir -p "$dir"
        curl --proto '=https' --tlsv1.2 -fsSL --retry 3 -o "$dir/$archive" \
          "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
        echo "${GITLEAKS_SHA256}  $dir/$archive" | sha256sum --check --strict -
        tar -xzf "$dir/$archive" -C "$dir" gitleaks
        echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
        "$dir/gitleaks" version

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
