name = "trace-demo"
main = "worker/index.ts"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "tracehiring.tech", custom_domain = true },
  { pattern = "demo.tracehiring.tech", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "STORE"
class_name = "DemoStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DemoStore"]
