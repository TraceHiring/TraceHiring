# pnpm 12 workspace (spec specs/m0-foundations.md §2, §4).
packages:
  - apps/*
  - packages/*
  - workers/*
  - services/*
  - e2e

# Shared versions (spec §4). Dependabot groups updates by catalog entry.
catalog:
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-boundaries: 7.2.0
  prettier: 3.9.10
  vitest: 4.1.11
  '@cloudflare/vitest-pool-workers': 0.23.0
  wrangler: 4.149.0
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react-router: 8.4.0
  hono: 4.13.13
  # Security bump (2026-10-24): GHSA-mrhx-c7xc-m3w5 (high, memory exhaustion on large arrays, < 4.6.6). 4.6.6
  # (published 2026-10-11) was 13 days old: a one-day exception to the two-week rule because the api parses
  # untrusted request bodies with zod (docs/build-notes.md "Autopilot changes", 2026-10-24).
  zod: 4.6.6
  '@supabase/supabase-js': 2.117.2
  supabase: 2.120.0
  lefthook: 2.2.1
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@types/node': 22.20.5
  globals: 17.13.0
  fast-check: 4.10.2
  # Dev tooling for e2e/ (specs/d1-demo-slice.md §7.2, no ADR): the newest release older than two weeks
  # (1.63.0, published 2026-09-04; 1.64.0 came out 2026-10-07).
  '@playwright/test': 1.63.0
  # DOM test runtime for apps/candidate (d1 AT-D30 behavioural test, AT-D36; dev tooling, no ADR): the newest
  # release older than two weeks (20.14.5, published 2026-09-12; 20.14.6 came out 2026-10-08). Not jsdom: jsdom
  # 30 needs undici 8, which the undici security override below pins to 7.
  happy-dom: 20.14.5
  # Sentry adapter (m0-foundations §9.2, d1 AT-D22): recruiter app, workers/jobs, services/api only.
  '@sentry/cloudflare': 11.1.0
  '@sentry/react': 11.1.0
  # Workers -> Postgres driver (ADR-031, DC-D7): services/api and workers/jobs only, exactly 3.4.9
  # (published 2026-04-05).
  postgres: 3.4.9
  # Zip reader for the item import Web Worker (ADR-033, specs/m1-test-authoring.md R5-48): apps/recruiter only,
  # streaming Unzip + UnzipInflate only; exactly 0.8.3 (published 2026-05-16).
  fflate: 0.8.3

# Build-script allow-list (pnpm 12 key, checked in S1.0).
allowBuilds:
  lefthook: true
  esbuild: true
  workerd: true
  supabase: true

minimumReleaseAgeExclude:
  - prettier@3.9.10

# Security overrides (CI `security` job, 2026-10-11), patch releases only. Remove each once no
# dependency pins the vulnerable version.
# - handlebars: eslint-plugin-boundaries 7.2.0 pins 4.7.9 (GHSA-8r5x-fm3f-whwj and GHSA-p8wg-vrv2-v86f
#   critical, GHSA-xw65-4hp5-5hc7 moderate; pnpm audit).
# - sharp, undici: @cloudflare/vitest-pool-workers 0.23.0 brings its own older miniflare with sharp 0.35.2
#   (GHSA-rgj7-g3m4-5g8c, GHSA-wq5f-xc86-pv6w) and undici 7.29.0 (ten advisories; osv-scanner). The
#   wrangler catalog version already uses sharp 0.35.5 and undici 7.29.1.
overrides:
  handlebars: 4.7.10
  sharp: 0.35.5
  undici: 7.29.1
  # Release-age pin (d1 AT-D22, 2026-10-14): @sentry/browser-utils 11.1.0 asks for web-vitals ^6.1.1,
  # whose newest, 6.2.3, was 9 days old; 6.2.2 (2026-09-14) is past the two-week rule. Remove once
  # a newer release is two weeks old.
  web-vitals: 6.2.2
  # GHSA-mrhx-c7xc-m3w5 (2026-10-24): @cloudflare/vitest-pool-workers 0.23.0 pins zod 4.4.3 exactly (dev tooling).
  # Remove once it no longer pins a version below 4.6.6.
  zod: 4.6.6

# braces <= 3.0.3 (GHSA-vfj7-8cjw-p6xm, high: stack exhaustion on deeply nested brace patterns) has no
# fixed release. It is reached only through eslint-plugin-boundaries > micromatch at lint time, with
# patterns from this repository's own eslint config: never untrusted input, never shipped. Ignored until a
# fix exists, then removed (docs/build-notes.md "Autopilot changes", 2026-10-11).
auditConfig:
  ignoreGhsas:
    - GHSA-vfj7-8cjw-p6xm
