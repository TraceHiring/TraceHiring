# pnpm 12 workspace (spec specs/m0-foundations.md §2, §4).
packages:
  - apps/*
  - packages/*
  - workers/*
  - services/*

# Shared versions (spec §4). Dependabot groups updates by catalog entry.
catalog:
  typescript: 6.0.3
  typescript-eslint: 8.71.1
  eslint: 9.39.5
  '@eslint/js': 9.39.5
  eslint-plugin-jsx-a11y: 6.10.2
  eslint-plugin-react-hooks: 7.1.1
  eslint-plugin-boundaries: 7.2.0
  prettier: 3.9.10
  vitest: 4.1.11
  '@cloudflare/vitest-pool-workers': 0.23.0
  wrangler: 4.149.0
  vite: 8.3.4
  '@vitejs/plugin-react': 6.1.2
  react: 19.3.0
  react-dom: 19.3.0
  '@types/react': 19.3.0
  '@types/react-dom': 19.3.0
  react-router: 8.4.0
  hono: 4.13.13
  zod: 4.6.5
  supabase: 2.120.0
  lefthook: 2.2.1
  '@commitlint/cli': 21.2.3
  '@commitlint/config-conventional': 21.2.3
  '@types/node': 22.20.5
  globals: 17.13.0
  fast-check: 4.10.2

# Build-script allow-list (pnpm 12 key, checked in S1.0).
allowBuilds:
  lefthook: true
  esbuild: true
  workerd: true
  supabase: true

minimumReleaseAgeExclude:
  - prettier@3.9.10
