# Synthetic fixture for scripts/test/check-workflows.test.mjs (spec §7.1, §7.2). Not a live
# workflow: tests copy it into a temp repo as .github/workflows/ci.yml. The SHAs are made up.
name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - 'milestone/**'
  workflow_dispatch:

permissions:
  contents: read

env:
  DO_NOT_TRACK: '1'

defaults:
  run:
    shell: bash

jobs:
  static:
    runs-on: ubuntu-24.04
    env:
      MIGRATIONS_BASE: origin/main
    steps:
      - name: Check out
        uses: actions/checkout@1111111111111111111111111111111111111111 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  rls:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup
      - run: pnpm test:rls

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
        with:
          persist-credentials: 'false'
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: gitleaks git --redact --no-banner
      - run: pnpm audit --prod --audit-level=high

  migrations:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - run: node scripts/check-migrations.mjs --base origin/main

  deploy-staging:
    needs: [static, rls, security, migrations]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' && (startsWith(github.ref, 'refs/heads/d1/') || startsWith(github.ref, 'refs/heads/milestone/'))) && github.repository == 'TraceHiring/TraceHiring'
    runs-on: ubuntu-24.04
    environment: staging
    concurrency: deploy-staging
    steps:
      - uses: actions/checkout@1111111111111111111111111111111111111111
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_STAGING_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          pnpm build
          for dir in workers/edge workers/jobs services/api; do
            (cd "$dir" && pnpm exec wrangler deploy --dry-run --env staging --outdir dist)
          done
      - name: Scan the build output
        run: node scripts/scan-dist.mjs
      - name: Check the public deploy variables
        env:
          CANDIDATE_TOKEN_KID: ${{ vars.CANDIDATE_TOKEN_KID }}
          CANDIDATE_TOKEN_PUBLIC_JWK: ${{ vars.CANDIDATE_TOKEN_PUBLIC_JWK }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: node scripts/check-deploy-vars.mjs
      - name: Apply migrations
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: pnpm exec supabase db push --db-url "$SUPABASE_STAGING_DB_URL"
      - name: Catalog checks
        env:
          SUPABASE_STAGING_DB_URL: ${{ secrets.SUPABASE_STAGING_DB_URL }}
        run: |
          for f in supabase/catalog-checks/MT-*.sql; do
            psql -X -v ON_ERROR_STOP=1 -At "$SUPABASE_STAGING_DB_URL" -f "$f"
          done
      - name: Create the staging buckets and queues
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-staging-resources.mjs
      - name: Deploy the api Worker
        working-directory: services/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN_WORKERS: ${{ vars.SENTRY_DSN_WORKERS }}
          CANDIDATE_TOKEN_KID: ${{ vars.CANDIDATE_TOKEN_KID }}
          CANDIDATE_TOKEN_PUBLIC_JWK: ${{ vars.CANDIDATE_TOKEN_PUBLIC_JWK }}
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          pnpm exec wrangler deploy dist/index.js --no-bundle --env staging \
            --var "VERSION:$GITHUB_SHA" \
            --var "SENTRY_DSN_WORKERS:$SENTRY_DSN_WORKERS" \
            --var "CANDIDATE_TOKEN_KID:$CANDIDATE_TOKEN_KID" \
            --var "CANDIDATE_TOKEN_PUBLIC_JWK:$CANDIDATE_TOKEN_PUBLIC_JWK" \
            --var "SUPABASE_URL:$SUPABASE_STAGING_URL" \
            --var "SUPABASE_PUBLISHABLE_KEY:$SUPABASE_STAGING_PUBLISHABLE_KEY"
      - name: Deploy the jobs Worker
        working-directory: workers/jobs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          SENTRY_DSN_WORKERS: ${{ vars.SENTRY_DSN_WORKERS }}
        run: |
          set -euo pipefail
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          pnpm exec wrangler deploy dist/index.js --no-bundle --env staging \
            --var "VERSION:$GITHUB_SHA" \
            --var "SENTRY_DSN_WORKERS:$SENTRY_DSN_WORKERS"
      - name: Deploy the edge Worker
        working-directory: workers/edge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CANDIDATE_TOKEN_PUBLIC_JWK: ${{ vars.CANDIDATE_TOKEN_PUBLIC_JWK }}
        run: |
          set -euo pipefail
          export WRANGLER_OUTPUT_FILE_PATH="$RUNNER_TEMP/wrangler-output.ndjson"
          pnpm exec wrangler deploy dist/index.js --no-bundle --env staging \
            --var "VERSION:$GITHUB_SHA" \
            --var "CANDIDATE_TOKEN_PUBLIC_JWK:$CANDIDATE_TOKEN_PUBLIC_JWK"
      - name: Check Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-staging-secrets.mjs
      - name: Smoke test, org sign-in
        env:
          SUPABASE_STAGING_URL: ${{ vars.SUPABASE_STAGING_URL }}
          SUPABASE_STAGING_PUBLISHABLE_KEY: ${{ vars.SUPABASE_STAGING_PUBLISHABLE_KEY }}
          STAGING_SMOKE_EMAIL: ${{ secrets.STAGING_SMOKE_EMAIL }}
          STAGING_SMOKE_PASSWORD: ${{ secrets.STAGING_SMOKE_PASSWORD }}
          STAGING_SMOKE_TOTP_SECRET: ${{ secrets.STAGING_SMOKE_TOTP_SECRET }}
        run: node scripts/smoke-staging-auth.mjs
