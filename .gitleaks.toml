# gitleaks configuration for Trace (spec specs/m0-foundations.md §6, AT-5, AT-6).
# Uses gitleaks' default rules plus the custom rules below. Add an allowlist entry only with a
# comment naming why the match is not a secret; never allowlist a real credential.
title = "Trace gitleaks config"

[extend]
useDefault = true

# Supabase secret API keys (spec §9.1, §10.2). gitleaks 8.30.1's default rules do not detect
# them (S1.4 security review M6). No entropy threshold: every match fails.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]
