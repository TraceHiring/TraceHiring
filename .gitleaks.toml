# gitleaks configuration for Trace (spec specs/m0-foundations.md §6, AT-5, AT-6).
# Uses the vendored gitleaks default rules (below) plus the custom rules in this file. Add an allowlist
# entry only with a comment naming why the match is not a secret; never allowlist a real credential.
title = "Trace gitleaks config"

# Not `useDefault = true`: gitleaks 8.30.1's built-in default config has a global allowlist regex
# `(?i)^true|false|null$` whose alternation precedence drops any secret that starts with "true",
# contains "false" or ends in "null" (S1.4 N10-N13 security re-review). Allowlists add up when a config
# extends another one, so the entry cannot be removed from here; and `path` cannot be combined with
# `useDefault`. The vendored file is upstream's config/gitleaks.toml at tag v8.30.1
# (https://raw.githubusercontent.com/gitleaks/gitleaks/v8.30.1/config/gitleaks.toml, 97,731 bytes,
# sha256 e163e53b9e7e8a8511e77271e2b323ed057759542a6d988258afe3a1fa329caf) with that one regex
# changed to `(?i)^(?:true|false|null)$`; scripts/test/gitleaks-config.test.mjs proves it.
# Upgrading gitleaks: re-vendor, change only that line (if upstream has not fixed it), re-pin the sha256.
# `path` is resolved from the directory gitleaks runs in, so run gitleaks at the repository root
# (lefthook, `pnpm lint`, CI and scripts/scan-dist.mjs all do).
[extend]
path = "config/gitleaks-8.30.1/gitleaks.toml"

# Supabase secret API keys (spec §9.1, §10.2). gitleaks 8.30.1's default rules do not detect
# them (S1.4 security review M6). No entropy threshold: every match fails.
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret API key (sb_secret_...)"
regex = '''sb_secret_[A-Za-z0-9_-]{20,}'''
keywords = ["sb_secret_"]

# The Supabase publishable key is public by design (m0b H10, d1 §7.1): the staging recruiter bundle inlines it
# as VITE_SUPABASE_PUBLISHABLE_KEY:`sb_publishable_...`, which generic-api-key flags (first staging dispatch,
# Chat E2). Only a secret that is exactly a publishable key, and only for generic-api-key. sb_secret_ keys keep
# their own rule above, and the recruiter build refuses any other key shape (headers-template checkPublishableKey).
[[allowlists]]
description = "Supabase publishable key (public, ships in the recruiter bundle)"
targetRules = ["generic-api-key"]
regexTarget = "secret"
regexes = ['''^sb_publishable_[A-Za-z0-9_-]{20,}$''']
